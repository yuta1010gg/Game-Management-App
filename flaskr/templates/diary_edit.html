<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <title>ゲーム管理アプリ - 日記の編集</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    </head>
    <body>
        <h1>ゲーム管理アプリ</h1>

        <h2>日記の編集：{{ game[1] }}</h2>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form method="post" action="{{ url_for('diary_edit', diary_id=entry[0]) }}">
            <table border="1">
                <tr>
                    <th>日付</th>
                    <td><input type="date" name="diary_date" value="{{ entry[2] }}"></td>
                </tr>
                <tr>
                    <th>本文</th>
                    <td><textarea name="body" rows="5" cols="50" required>{{ entry[3] }}</textarea></td>
                </tr>
            </table>

            <br>
            <input type="submit" value="更新">
        </form>

        <br>
        <a href="{{ url_for('diary', game_id=game[0]) }}">日記ページに戻る</a>
    </body>
</html>
