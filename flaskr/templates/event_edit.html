<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <title>ゲーム管理アプリ - 予定の編集</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    </head>
    <body>
        <h1>ゲーム管理アプリ</h1>

        <h2>予定の編集</h2>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form method="post" action="{{ url_for('event_edit', event_id=event[0]) }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <table border="1">
                <tr>
                    <th>予定の名前</th>
                    <td><input type="text" name="title" maxlength="100" value="{{ event[2] }}" required></td>
                </tr>
                <tr>
                    <th>開始日</th>
                    <td><input type="date" name="start_date" value="{{ event[3] }}" required></td>
                </tr>
                <tr>
                    <th>終了日</th>
                    <td>
                        <input type="date" name="end_date" value="{{ event[4] }}">
                        <br><small>※ 空欄にすると、1日だけの予定になります</small>
                    </td>
                </tr>
                <tr>
                    <th>ゲーム</th>
                    <td>
                        <select name="game_id">
                            <option value="">指定なし(ゲーム全般の予定)</option>
                            {% for g in game_choices %}
                                <option value="{{ g[0] }}" {% if g[0] == event[1] %}selected{% endif %}>{{ g[1] }}</option>
                            {% endfor %}
                        </select>
                    </td>
                </tr>
                <tr>
                    <th>メモ</th>
                    <td><textarea name="memo" rows="4">{{ event[5] or '' }}</textarea></td>
                </tr>
            </table>

            <br>
            <input type="submit" value="更新">
        </form>

        <form method="post" action="{{ url_for('event_delete', event_id=event[0]) }}"
              onsubmit="return confirm('この予定を削除しますか？');">
            <input type="submit" value="削除">
        </form>

        <br>
        <a href="{{ url_for('calendar_page', month=event[3][:7], day=event[3]) }}">カレンダーに戻る</a>
    </body>
</html>
